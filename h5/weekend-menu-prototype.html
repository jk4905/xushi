    document.addEventListener('input',event=>{const target=event.target;try{if(['link-name','link-url'].includes(target.id)){captureLinkDraft();return;}if(target.id==='builder-search'){builderQuery=target.value.slice(0,100);captureBuilder();filterBuilder();return;}if(['builder-title','builder-date'].includes(target.id)){captureBuilder();return;}if(['recipe-name','recipe-ingredients','recipe-steps'].includes(target.id)){target.removeAttribute('aria-invalid');target.removeAttribute('aria-describedby');const error=document.getElementById(`${target.id}-error`);if(error)error.hidden=true;captureRecipeDraft();return;}if(target.id==='library-search'){libraryQuery=target.value;const results=document.getElementById('library-results');if(results)results.innerHTML=libraryResults();return;}if(target.dataset.field==='quantity')change(MealModel.updateItem(state,target.dataset.item,{quantity:target.value}),false);if(target.hasAttribute('data-notes'))change(MealModel.setNotes(state,target.value),false);}catch(error){notify(error.message,0);}});

          const file=target.files[0];if(file.size>backupLimit)throw new Error('备份文件过大，单份上限为32 MB。');let parsed=JSON.parse(await file.text());
          if(!HouseholdModel.validate(parsed)){if(!MealModel.validate(parsed))throw new Error('备份内容不完整。');parsed=HouseholdModel.migrate(parsed,dishes.map(dish=>({id:dish.key,name:dish.name,kind:dish.kind,steps:dish.key==='beef'?beefSteps.map(({title,text})=>({title,text})):[]})));}
          const editedDrafts=[...recipeDrafts.values()].filter(draft=>draft.id).length;
          confirmAction('导入这份家庭用餐备份？',`会替换当前的餐、菜谱、餐单和用餐人，阅读位置与选菜草稿重新开始。${editedDrafts?`同时放弃 ${editedDrafts} 份已存菜谱的编辑草稿；新增菜谱的草稿保留。`:''}需要保留时，请先取消、保存草稿并导出。`,'替换并导入',()=>{
            const cacheBefore=new Map(),newDrafts=[...recipeDrafts.values()].filter(draft=>!draft.id);
            const restoreCache=()=>{for(const [key,value] of cacheBefore)try{if(value===null)window.sessionStorage.removeItem(key);else window.sessionStorage.setItem(key,value);}catch{draftStorageFailed=true;taskDraftStorageFailed=true;cookingStorageFailed=true;}};
            try{
              for(const key of [readerKey,cookingStorageKey,navigationKey,builderKey,draftKey])cacheBefore.set(key,window.sessionStorage.getItem(key));
              for(const [key,value] of [[readerKey,{positions:[],selected:[]}],[cookingStorageKey,[]],[navigationKey,null],[builderKey,[]],[draftKey,newDrafts]])window.sessionStorage.setItem(key,JSON.stringify(value));
            }catch{restoreCache();notify('导入未完成：阅读位置与草稿暂不能重置，原记录仍保留。请重试。',0);return false;}
            const blocked=storageBlocked;storageBlocked=false;
            if(!saveHousehold({...parsed,meals:parsed.meals.map(meal=>meal.status==='planned'?{...meal,data:{...meal.data,items:meal.data.items.map(item=>({...item,status:'unchecked'}))}}:meal)})){restoreCache();storageBlocked=blocked;overview();notify('导入未能保存，原记录和草稿已保留，请重试。',0);return false;}
            if(dialog.open)closeSheet(false);for(const [key,draft]of recipeDrafts)if(draft.id)recipeDrafts.delete(key);cookingProgress.clear();readerPositions.clear();readerSelections.clear();builderDrafts.clear();builderDraft=null;cookingStorageFailed=false;
            viewedMealId=null;shoppingSession=null;cookStep=0;tabStacks.home=[{route:'home',scroll:0}];tabStacks.library=[{route:'library',scroll:0},{route:'backup',scroll:0}];activeTab='library';currentRoute='backup';writeHistory(true);finishNavigation('');notify('已导入。待做餐的采购状态重新核对。');
          });
        }
      }catch(error){notify(target.id==='import-file'?'导入失败，当前记录已保留。'+error.message:error.message,0);}
      finally{if(target.id==='import-file'){target.value='';importBusy=false;if(currentRoute==='backup')render();}}
    });
    document.addEventListener('click',event=>{
      if(Date.now()<suppressClickUntil){event.preventDefault();return;}
      const button=event.target.closest('button');if(!button||button.disabled)return;
      try{
        if(button.dataset.tab){selectTab(button.dataset.tab);return;}if(button.dataset.route){navigate(button.dataset.route);return;}
        const action=button.dataset.action;
        if(handleHouseholdAction(button))return;
        if(action==='back')goBack();
        if(action==='finish-adjustment'){if(storageBlocked||(unsaved&&!persist())){overview();notify('调整未能保存，修改仍保留在本页，请重试或导出备份。',0);}else{overview();dismissMessage();goBack();}}
        if(action==='dismiss-message')dismissMessage();
        if(action==='open-item')openSheet('item',button.dataset.item);
        if(action==='open-stock')openSheet('stock');
        if(action==='open-pending')openSheet('pending');
        if(action==='open-save')openSheet('save');
        if(action==='open-add')openSheet('add');
        if(action==='open-more')openSheet('more');
        if(action==='close-sheet')closeSheet();
        if(action==='cancel-confirmation')closeConfirmation();
        if(action==='confirm-action'){const callback=confirmationAction;const result=callback?.();if(result!==false)closeConfirmation();}
        if(action==='toggle-prepared'){showPrepared=!showPrepared;render();}
        if(action==='choice'){
          change(MealModel.updateItem(state,button.dataset.item,{choice:button.dataset.value}),false);
          for(const choice of sheetView.querySelectorAll('[data-action="choice"]'))if(choice.dataset.item===button.dataset.item)choice.setAttribute('aria-pressed',String(choice.dataset.value===button.dataset.value));
          const input=document.getElementById(`quantity-${button.dataset.item}`);if(input)input.disabled=button.dataset.value==='omit';syncSelectionIndicators();

        if(action==='commit-stock'){let next=state;for(const item of state.items.filter(item=>item.choice==='include'&&item.status!=='bought')){const status=stockSelection.has(item.id)?'at-home':item.status==='at-home'?'unchecked':item.status;if(status!==item.status)next=MealModel.updateItem(next,item.id,{status});}if(next!==state){shoppingSession=null;change(next,false);}closeSheet();notify(unsaved?'库存修改暂存在本页，请重试保存或导出备份。':'家里库存已核对。');}

          const selected=household.activeMealId===currentMeal().id?household:HouseholdModel.selectMeal(household,currentMeal().id);
          const next=HouseholdModel.updateMealData(selected,MealModel.addItem(state,document.getElementById('add-name').value,document.getElementById('add-dish').value));

        if(action==='import')document.getElementById('import-file').click();

      }catch(error){notify(error.message,0);}

    dialog.addEventListener('cancel',event=>{event.preventDefault();closeSheet();});dialog.addEventListener('click',event=>{if(event.target===dialog)closeSheet();});
    confirmationDialog.addEventListener('cancel',event=>{event.preventDefault();closeConfirmation();});confirmationDialog.addEventListener('click',event=>{if(event.target===confirmationDialog)closeConfirmation();});
    let edgeGesture=null,sheetGesture=null;
    function clearEdge() {edgeGesture=null;view.style.transform='';navigationBar.style.transform='';}
    view.addEventListener('pointerdown',event=>{const left=view.getBoundingClientRect?.().left||0;if(event.button>0||dialog.open||confirmationDialog.open||tabStacks[activeTab].length<2||event.clientX<left||event.clientX>left+24||event.target.closest('input,textarea,select'))return;edgeGesture={x:event.clientX,y:event.clientY,id:event.pointerId};});
    view.addEventListener('pointermove',event=>{if(!edgeGesture||event.pointerId!==edgeGesture.id)return;const dx=event.clientX-edgeGesture.x,dy=event.clientY-edgeGesture.y;if(Math.abs(dy)>18&&Math.abs(dy)>Math.abs(dx)){clearEdge();return;}if(dx>12&&dx>Math.abs(dy)*1.5){event.preventDefault();view.setPointerCapture?.(event.pointerId);view.style.transform=`translateX(${Math.min(dx,140)}px)`;navigationBar.style.transform=view.style.transform;}});
    view.addEventListener('pointerup',event=>{if(!edgeGesture||event.pointerId!==edgeGesture.id)return;const dx=event.clientX-edgeGesture.x,dy=event.clientY-edgeGesture.y;clearEdge();if(dx>80&&dx>Math.abs(dy)*1.5){suppressClickUntil=Date.now()+250;goBack();}});

    dialog.addEventListener('pointermove',event=>{if(!sheetGesture||event.pointerId!==sheetGesture.id)return;const dy=event.clientY-sheetGesture.y;if(dy>0){event.preventDefault();dialog.setPointerCapture?.(event.pointerId);dialog.style.transform=`translateY(${Math.min(dy,220)}px)`;}});
    dialog.addEventListener('pointerup',event=>{if(!sheetGesture||event.pointerId!==sheetGesture.id)return;const dy=event.clientY-sheetGesture.y;sheetGesture=null;dialog.style.transform='';if(dy>80){suppressClickUntil=Date.now()+250;closeSheet();}});

        dialog.style.setProperty('--keyboard-inset',`${inset}px`);document.querySelector('.app')?.style.setProperty('--visual-viewport-height',`${window.visualViewport.height}px`);
